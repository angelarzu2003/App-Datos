name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DatoReal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DatoReal-debug-apk
          path: DatoReal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DatoReal APK (compilación ${{ github.run_number }})
          files: DatoReal/app/build/outputs/apk/debug/*.apk
